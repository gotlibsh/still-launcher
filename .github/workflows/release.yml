name: Release

# Every push to main builds a signed APK and publishes it as a GitHub release.
# Obtainium on the phone watches these releases and offers the update.
on:
  push:
    branches: [main]
    # Text-only changes (README, privacy policy) don't need a new app version.
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.STILL_KEYSTORE_BASE64 != '' }}
    steps:
      # Actions are pinned to exact commits, so a re-pointed tag can't run new code next to
      # the signing key. To update one, replace the hash (the comment says which version).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew test

      - name: Signing key missing
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Release signing secrets are not set yet, so no release was published. Run set-github-secrets.ps1 on the PC."

      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        env:
          STILL_KEYSTORE_BASE64: ${{ secrets.STILL_KEYSTORE_BASE64 }}
        run: |
          echo "$STILL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/still-release.jks"

      - name: Build signed APK
        if: env.HAS_KEY == 'true'
        env:
          STILL_KEYSTORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_KEYSTORE_PASSWORD: ${{ secrets.STILL_KEYSTORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.STILL_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.STILL_KEY_PASSWORD }}
          STILL_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease

      - name: Publish release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "still-$VERSION.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VERSION" "still-$VERSION.apk" --title "Still $VERSION" --notes-file notes.txt

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/still-release.jks"
